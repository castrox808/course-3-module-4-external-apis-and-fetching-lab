<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Alerts App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Weather Alerts App</h1>
    <input type="text" id="state-input" placeholder="Enter state abbreviation">
    <button id="fetch-alerts">Get Weather Alerts</button>
    
    <!-- This element shows the loading text while fetching data -->
    <div id="loading-spinner" style="display: none;">Loading alerts...</div>

    <div id="alerts-display"></div>
    
    <!-- Added style="display: none;" so JavaScript can toggle it easily -->
    <div id="error-message" style="display: none;"></div>

    <script src="./index.js"></script>
</body>
</html>
